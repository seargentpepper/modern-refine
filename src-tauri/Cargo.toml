[package]
name = "modern-refine"
version = "0.1.0"
description = "ModernRefine - Native Desktop Data Cleaning Station"
authors = ["Analyticraft Team"]
edition = "2024"

[lib]
name = "modern_refine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
modern_refine_engine = { path = "../src-rust" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
