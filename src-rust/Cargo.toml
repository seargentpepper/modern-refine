[package]
name = "modern_refine_engine"
version = "0.2.0"
edition = "2021"
description = "Motor nativo en Rust ligero para ModernRefine (Clustering en paralelo de 5 niveles + Ingesta Excel/CSV)"

[dependencies]
calamine = "0.38"
csv = "1.3"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strsim = "0.11"
unicode-normalization = "0.1"
